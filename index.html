<!DOCTYPE html>
<html lang="tr" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EFB Flight Logbook</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EFB Logbook">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            efbBg: '#0b111e',
            efbPanel: '#131c2e',
            efbCard: '#1a263d',
            efbBorder: '#243452',
            thyRed: '#e11937',
            lhYellow: '#f3a000',
            efbAccent: '#3b82f6'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-efbBg text-slate-100 font-sans h-full overflow-hidden select-none">

  <!-- iPad EFB Ana Konteyner -->
  <div class="flex h-full w-full">

    <!-- SOL PANEL: Uçuş Geçmişi & İstatistikler (%45) -->
    <div class="w-[45%] h-full bg-efbPanel border-r border-efbBorder flex flex-col p-6 overflow-hidden">
      
      <!-- EFB Header -->
      <div class="flex justify-between items-center pb-4 border-b border-efbBorder">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-thyRed flex items-center justify-center text-white font-bold shadow-md shadow-thyRed/20">
            <i class="fa-solid fa-plane"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
              PILOT LOGBOOK <span class="text-[10px] bg-efbBorder text-slate-300 px-1.5 py-0.5 rounded font-mono">EFB v2.0</span>
            </h1>
            <p class="text-[11px] text-slate-400">Electronic Flight Bag • Crew Interface</p>
          </div>
        </div>
        <button onclick="exportData()" class="px-3 py-1.5 text-xs font-semibold bg-efbCard hover:bg-efbBorder text-slate-300 rounded-lg border border-efbBorder transition">
          <i class="fa-solid fa-download mr-1"></i> Dışa Aktar
        </button>
      </div>

      <!-- İstatistikler -->
      <div class="grid grid-cols-3 gap-3 my-4">
        <div class="bg-efbCard p-3 rounded-xl border border-efbBorder/80">
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Toplam Süre</p>
          <p id="statTotalHours" class="text-xl font-black text-lhYellow font-mono mt-0.5">00:00</p>
        </div>
        <div class="bg-efbCard p-3 rounded-xl border border-efbBorder/80">
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Uçuş Sayısı</p>
          <p id="statTotalFlights" class="text-xl font-black text-sky-400 font-mono mt-0.5">0</p>
        </div>
        <div class="bg-efbCard p-3 rounded-xl border border-efbBorder/80">
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">İniş Sayısı</p>
          <p id="statTotalLandings" class="text-xl font-black text-emerald-400 font-mono mt-0.5">0</p>
        </div>
      </div>

      <!-- Uçuş Geçmişi -->
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Son Sektörler</h2>
      </div>
      <div id="flightList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
        <!-- JS ile doldurulacak -->
      </div>
    </div>

    <!-- SAĞ PANEL: Yeni Uçuş Ekleme Formu (%55) -->
    <div class="w-[55%] h-full bg-efbBg p-6 overflow-y-auto flex flex-col justify-between">
      <div>
        <!-- Başlık -->
        <div class="flex items-center justify-between mb-5 pb-3 border-b border-efbBorder">
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-thyRed"></i> UÇUŞ KAYDI (SECTOR LOG)
          </h2>
          <span class="text-xs text-slate-400 font-mono">ALL TIMES IN UTC / ZULU</span>
        </div>

        <form id="flightForm" onsubmit="saveFlight(event)" class="space-y-4">
          
          <!-- Satır 1: Tarih & Uçak -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Tarih</label>
              <input type="date" id="date" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Uçak Tipi</label>
              <input type="text" id="aircraft" placeholder="Örn: B787-9 / A350" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Tescil / Callsign</label>
              <input type="text" id="registration" placeholder="Örn: TC-LJA" class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-thyRed">
            </div>
          </div>

          <!-- Satır 2: Rota ve Canlı METAR Sorgulama -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Kalkış (DEP)</label>
              <input type="text" id="dep" placeholder="LTFM" maxlength="4" onblur="fetchMetar('dep')" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Varış (ARR)</label>
              <input type="text" id="arr" placeholder="EDDF" maxlength="4" onblur="fetchMetar('arr')" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Yedek (ALTN)</label>
              <input type="text" id="altn" placeholder="EDDK" maxlength="4" class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-thyRed">
            </div>
          </div>

          <!-- Canlı METAR Bilgi Kutusu -->
          <div id="metarBox" class="hidden bg-efbCard/90 p-3 rounded-lg border border-efbBorder text-xs space-y-1">
            <div class="flex items-center justify-between text-lhYellow font-mono font-bold text-[11px]">
              <span><i class="fa-solid fa-cloud-sun-rain mr-1"></i> CANLI METAR BİLGİSİ</span>
              <span id="metarStation" class="uppercase"></span>
            </div>
            <p id="metarText" class="text-slate-300 font-mono text-[11px] leading-relaxed break-words select-text">Yükleniyor...</p>
          </div>

          <!-- Satır 3: Blok Saatleri ve Süre -->
          <div class="grid grid-cols-3 gap-3 p-3 bg-efbCard/50 rounded-xl border border-efbBorder">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Off-Block (Out)</label>
              <input type="time" id="offBlock" onchange="calculateDuration()" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">On-Block (In)</label>
              <input type="time" id="onBlock" onchange="calculateDuration()" required class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Block Time</label>
              <input type="text" id="duration" readonly placeholder="00:00" class="w-full bg-efbBg border border-efbBorder rounded-lg px-3 py-2 text-sm text-lhYellow font-bold font-mono cursor-not-allowed">
            </div>
          </div>

          <!-- Satır 4: Şartlar ve İnişler -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Uçuş Kuralı</label>
              <select id="rules" class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
                <option value="IFR">IFR (Instrument)</option>
                <option value="VFR">VFR (Visual)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">İniş Sayısı</label>
              <input type="number" id="landings" value="1" min="1" class="w-full bg-efbCard border border-efbBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-thyRed">
            </div>
          </div>

          <!-- Notlar -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Uçuş Notları & Yaklaşma Detayları</label>
            <textarea id="notes" rows="2" placeholder="Pist 16R ILS Cat III yaklaşması, rüzgar hamleli..." class="w-full bg-efbCard border border-efbBorder rounded-lg p-3 text-sm text-white focus:outline-none focus:border-thyRed resize-none"></textarea>
          </div>

          <!-- Kaydet Butonu -->
          <button type="submit" class="w-full bg-thyRed hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-thyRed/20 transition flex items-center justify-center gap-2 tracking-wide uppercase text-xs">
            <i class="fa-solid fa-check-double"></i> Sektör Kaydını Tamamla
          </button>
        </form>
      </div>

      <p class="text-center text-[10px] text-slate-500 mt-4 font-mono">AVCOCKPIT EFB SYSTEM • CREW LOGBOOK VERSION</p>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      loadFlights();
    });

    function getStoredFlights() {
      return JSON.parse(localStorage.getItem('msfs_flights') || '[]');
    }

    // Canlı METAR Çekme (aviationweather.gov API)
    async function fetchMetar(type) {
      const field = document.getElementById(type);
      const icao = field.value.trim().toUpperCase();
      if (icao.length !== 4) return;

      const metarBox = document.getElementById('metarBox');
      const metarStation = document.getElementById('metarStation');
      const metarText = document.getElementById('metarText');

      metarBox.classList.remove('hidden');
      metarStation.innerText = `${icao} METAR`;
      metarText.innerText = 'Güncel METAR verisi çekiliyor...';

      try {
        const response = await fetch(`https://aviationweather.gov/api/data/metar?ids=${icao}&format=raw`);
        const data = await response.text();
        
        if (data && data.trim() !== '') {
          metarText.innerText = data.trim();
        } else {
          metarText.innerText = `${icao} için METAR bulunamadı.`;
        }
      } catch (err) {
        metarText.innerText = 'METAR bağlantısı sağlanamadı.';
      }
    }

    function calculateDuration() {
      const off = document.getElementById('offBlock').value;
      const on = document.getElementById('onBlock').value;
      if (!off || !on) return;

      const [offH, offM] = off.split(':').map(Number);
      const [onH, onM] = on.split(':').map(Number);

      let totalMinutes = (onH * 60 + onM) - (offH * 60 + offM);
      if (totalMinutes < 0) totalMinutes += 24 * 60;

      const h = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
      const m = (totalMinutes % 60).toString().padStart(2, '0');
      document.getElementById('duration').value = `${h}:${m}`;
    }

    function saveFlight(e) {
      e.preventDefault();
      const flights = getStoredFlights();

      const newFlight = {
        id: Date.now(),
        date: document.getElementById('date').value,
        aircraft: document.getElementById('aircraft').value,
        registration: document.getElementById('registration').value.toUpperCase(),
        dep: document.getElementById('dep').value.toUpperCase(),
        arr: document.getElementById('arr').value.toUpperCase(),
        altn: document.getElementById('altn').value.toUpperCase(),
        offBlock: document.getElementById('offBlock').value,
        onBlock: document.getElementById('onBlock').value,
        duration: document.getElementById('duration').value,
        rules: document.getElementById('rules').value,
        landings: parseInt(document.getElementById('landings').value) || 1,
        notes: document.getElementById('notes').value
      };

      flights.unshift(newFlight);
      localStorage.setItem('msfs_flights', JSON.stringify(flights));
      
      document.getElementById('flightForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('duration').value = '';
      document.getElementById('metarBox').classList.add('hidden');
      
      loadFlights();
    }

    function deleteFlight(id) {
      if (!confirm('Bu sektör kaydını silmek istediğinize emin misiniz?')) return;
      let flights = getStoredFlights();
      flights = flights.filter(f => f.id !== id);
      localStorage.setItem('msfs_flights', JSON.stringify(flights));
      loadFlights();
    }

    function loadFlights() {
      const flights = getStoredFlights();
      const listEl = document.getElementById('flightList');
      listEl.innerHTML = '';

      let totalMins = 0;
      let totalLandings = 0;

      if (flights.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs font-mono">SEKTÖR KAYDI BULUNAMADI</div>`;
      }

      flights.forEach(f => {
        if (f.duration) {
          const [h, m] = f.duration.split(':').map(Number);
          totalMins += (h * 60) + m;
        }
        totalLandings += (f.landings || 1);

        const card = document.createElement('div');
        card.className = "bg-efbCard border border-efbBorder rounded-xl p-3.5 transition hover:border-slate-600 relative";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-sm font-black text-white font-mono tracking-wider">${f.dep}</span>
              <i class="fa-solid fa-arrow-right text-[10px] text-thyRed"></i>
              <span class="text-sm font-black text-white font-mono tracking-wider">${f.arr}</span>
              ${f.altn ? `<span class="text-[9px] bg-efbBg text-slate-400 px-1 py-0.5 rounded border border-efbBorder font-mono">ALTN: ${f.altn}</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black text-lhYellow font-mono bg-efbBg px-2 py-0.5 rounded border border-efbBorder">${f.duration || '00:00'}</span>
              <button onclick="deleteFlight(${f.id})" class="text-slate-500 hover:text-thyRed text-xs px-1 transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-400">
            <span class="font-medium text-slate-300"><i class="fa-solid fa-plane-up text-slate-500 mr-1.5"></i>${f.aircraft} <span class="text-slate-500 font-mono text-[11px]">(${f.registration || 'N/A'})</span></span>
            <span class="font-mono text-[11px] text-slate-400">${f.date}</span>
          </div>
          ${f.notes ? `<p class="text-[11px] text-slate-400 mt-2 pt-1.5 border-t border-efbBorder/50 italic line-clamp-1 font-mono">${f.notes}</p>` : ''}
        `;
        listEl.appendChild(card);
      });

      const totalH = Math.floor(totalMins / 60).toString().padStart(2, '0');
      const totalM = (totalMins % 60).toString().padStart(2, '0');
      document.getElementById('statTotalHours').innerText = `${totalH}:${totalM}`;
      document.getElementById('statTotalFlights').innerText = flights.length;
      document.getElementById('statTotalLandings').innerText = totalLandings;
    }

    function exportData() {
      const flights = getStoredFlights();
      const blob = new Blob([JSON.stringify(flights, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `efb_logbook_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
  </script>
</body>
</html>
