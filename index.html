<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Electronic Flight Bag - Logbook</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EFB Logbook">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            efbBg: '#e0f2fe',        // Vibrant sky blue tint
            efbPanel: '#ffffff',     // Pure white panel
            efbCard: '#f0f9ff',      // Very light blue card
            efbBorder: '#bae6fd',    // Sky blue border
            brandBlue: '#0284c7',    // Vivid blue
            brandBright: '#0ea5e9',  // Bright electric blue
            brandDark: '#0369a1',    // Deep sky blue
            efbTextPrimary: '#0c4a6e',
            efbTextSecondary: '#0369a1'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-efbBg text-efbTextPrimary font-sans h-full overflow-hidden select-none">

  <!-- Main iPad Container -->
  <div class="flex h-full w-full">

    <!-- LEFT PANEL: Flight History & Stats (40%) -->
    <div class="w-[40%] h-full bg-efbPanel border-r border-efbBorder flex flex-col p-6 overflow-hidden shadow-sm">
      
      <!-- Header -->
      <div class="flex justify-between items-center pb-4 border-b border-efbBorder">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-brandBright text-white flex items-center justify-center font-bold shadow-md shadow-brandBright/30">
            <i class="fa-solid fa-plane-up text-lg"></i>
          </div>
          <div>
            <h1 class="text-base font-black tracking-tight text-brandDark">
              PILOT LOGBOOK <span class="text-[10px] bg-sky-100 text-brandBlue px-2 py-0.5 rounded-full font-mono font-bold">ICAO EFB</span>
            </h1>
            <p class="text-[11px] text-efbTextSecondary font-medium">Electronic Flight Bag • Crew Interface</p>
          </div>
        </div>
        <button onclick="exportData()" class="px-3 py-1.5 text-xs font-bold bg-sky-50 hover:bg-sky-100 text-brandBlue rounded-xl border border-efbBorder transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-export"></i> Export JSON
        </button>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 gap-3 my-4">
        <div class="bg-efbCard p-3.5 rounded-2xl border border-efbBorder">
          <p class="text-[10px] text-efbTextSecondary font-bold uppercase tracking-wider">Total Flight Hours</p>
          <p id="statTotalHours" class="text-2xl font-black text-brandBright font-mono mt-0.5">00:00</p>
        </div>
        <div class="bg-efbCard p-3.5 rounded-2xl border border-efbBorder">
          <p class="text-[10px] text-efbTextSecondary font-bold uppercase tracking-wider">Total Sectors</p>
          <p id="statTotalFlights" class="text-2xl font-black text-brandDark font-mono mt-0.5">0</p>
        </div>
      </div>

      <!-- Flight History List -->
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-brandDark">Sector Logs</h2>
      </div>
      <div id="flightList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
        <!-- JS Render -->
      </div>
    </div>

    <!-- RIGHT PANEL: Form (60%) -->
    <div class="w-[60%] h-full bg-efbBg p-6 overflow-y-auto flex flex-col justify-between">
      <div>
        <!-- Title bar -->
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-efbBorder">
          <h2 class="text-base font-extrabold text-brandDark flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-brandBright"></i> NEW SECTOR ENTRY
          </h2>
          <span class="text-xs text-brandBlue font-mono font-bold bg-white px-2.5 py-1 rounded-full border border-efbBorder">UTC / ZULU TIME</span>
        </div>

        <form id="flightForm" onsubmit="saveFlight(event)" class="space-y-3.5">
          
          <!-- Row 1: Date, Aircraft ICAO, Engine Variant -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Date</label>
              <input type="date" id="date" required class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-semibold text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Aircraft (ICAO Code)</label>
              <select id="aircraft" required onchange="updateEngineVariants()" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-bold font-mono text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
                <option value="" disabled selected>Select ICAO Type...</option>
                
                <optgroup label="Airbus">
                  <option value="A20N">A20N - Airbus A320neo</option>
                  <option value="A21N">A21N - Airbus A321neo</option>
                  <option value="A19N">A19N - Airbus A319neo</option>
                  <option value="A320">A320 - Airbus A320-200</option>
                  <option value="A321">A321 - Airbus A321-200</option>
                  <option value="A319">A319 - Airbus A319-100</option>
                  <option value="A221">A221 - Airbus A220-100</option>
                  <option value="A223">A223 - Airbus A220-300</option>
                  <option value="A332">A332 - Airbus A330-200</option>
                  <option value="A333">A333 - Airbus A330-300</option>
                  <option value="A339">A339 - Airbus A330-900neo</option>
                  <option value="A343">A343 - Airbus A340-300</option>
                  <option value="A346">A346 - Airbus A340-600</option>
                  <option value="A359">A359 - Airbus A350-900</option>
                  <option value="A351">A351 - Airbus A350-1000</option>
                  <option value="A388">A388 - Airbus A380-800</option>
                </optgroup>

                <optgroup label="Boeing">
                  <option value="B737">B737 - Boeing 737-700</option>
                  <option value="B738">B738 - Boeing 737-800</option>
                  <option value="B739">B739 - Boeing 737-900ER</option>
                  <option value="B37M">B37M - Boeing 737 MAX 7</option>
                  <option value="B38M">B38M - Boeing 737 MAX 8</option>
                  <option value="B39M">B39M - Boeing 737 MAX 9</option>
                  <option value="B3XM">B3XM - Boeing 737 MAX 10</option>
                  <option value="B752">B752 - Boeing 757-200</option>
                  <option value="B753">B753 - Boeing 757-300</option>
                  <option value="B763">B763 - Boeing 767-300ER</option>
                  <option value="B772">B772 - Boeing 777-200ER</option>
                  <option value="B77W">B77W - Boeing 777-300ER</option>
                  <option value="B77F">B77F - Boeing 777 Freighter</option>
                  <option value="B779">B779 - Boeing 777-9X</option>
                  <option value="B788">B788 - Boeing 787-8</option>
                  <option value="B789">B789 - Boeing 787-9</option>
                  <option value="B78X">B78X - Boeing 787-10</option>
                  <option value="B744">B744 - Boeing 747-400</option>
                  <option value="B748">B748 - Boeing 747-8i</option>
                </optgroup>

                <optgroup label="Regional / GA">
                  <option value="E190">E190 - Embraer E190</option>
                  <option value="E195">E195 - Embraer E195</option>
                  <option value="E295">E295 - Embraer E195-E2</option>
                  <option value="CRJ9">CRJ9 - Bombardier CRJ-900</option>
                  <option value="AT76">AT76 - ATR 72-600</option>
                  <option value="C172">C172 - Cessna 172 Skyhawk</option>
                </optgroup>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Engine Variant</label>
              <select id="engineVariant" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-semibold text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
                <option value="Default / Standard">Default / Standard</option>
              </select>
            </div>
          </div>

          <!-- Row 2: Flight Number, Callsign, Registration -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Flight Number</label>
              <input type="text" id="flightNumber" placeholder="THY123" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono font-bold uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">ATC Callsign</label>
              <input type="text" id="callsign" placeholder="TURKISH 123" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono font-bold uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Tail Registration</label>
              <input type="text" id="registration" placeholder="TC-LJA" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
          </div>

          <!-- Row 3: Route (DEP / ARR / ALTN) -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Departure (ICAO)</label>
              <input type="text" id="dep" placeholder="LTFM" maxlength="4" required class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono font-extrabold uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Arrival (ICAO)</label>
              <input type="text" id="arr" placeholder="EDDF" maxlength="4" required class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono font-extrabold uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Alternate (ICAO)</label>
              <input type="text" id="altn" placeholder="EDDK" maxlength="4" class="w-full bg-white border border-efbBorder rounded-xl px-3 py-2 text-sm font-mono uppercase text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright">
            </div>
          </div>

          <!-- Row 4: Step Climbs / Flight Levels -->
          <div class="bg-white p-3 rounded-2xl border border-efbBorder space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-[11px] font-bold uppercase tracking-wider text-brandDark">
                Flight Levels & Step Climbs
              </label>
              <button type="button" onclick="addStepClimbInput()" class="text-xs text-brandBright hover:text-brandDark font-bold flex items-center gap-1 transition">
                <i class="fa-solid fa-circle-plus"></i> Add Step Climb
              </button>
            </div>
            <div id="flContainer" class="flex flex-wrap gap-2">
              <input type="text" placeholder="Initial FL (e.g. FL340)" class="fl-input bg-efbCard border border-efbBorder rounded-xl px-3 py-1.5 text-xs font-mono font-bold uppercase text-efbTextPrimary w-44 focus:outline-none focus:border-brandBright" required>
            </div>
          </div>

          <!-- Row 5: Off-Block, On-Block, Duration, Rule -->
          <div class="grid grid-cols-4 gap-3 p-3 bg-white rounded-2xl border border-efbBorder">
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-brandDark mb-1">Off-Block (Out)</label>
              <input type="time" id="offBlock" onchange="calculateDuration()" required class="w-full bg-efbCard border border-efbBorder rounded-xl px-2 py-1.5 text-xs font-bold text-efbTextPrimary focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-brandDark mb-1">On-Block (In)</label>
              <input type="time" id="onBlock" onchange="calculateDuration()" required class="w-full bg-efbCard border border-efbBorder rounded-xl px-2 py-1.5 text-xs font-bold text-efbTextPrimary focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-brandDark mb-1">Block Time</label>
              <input type="text" id="duration" readonly placeholder="00:00" class="w-full bg-sky-100 border border-efbBorder rounded-xl px-2 py-1.5 text-xs font-black font-mono text-brandBright cursor-not-allowed">
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase tracking-wider text-brandDark mb-1">Rules</label>
              <select id="rules" class="w-full bg-efbCard border border-efbBorder rounded-xl px-2 py-1.5 text-xs font-bold text-efbTextPrimary focus:outline-none">
                <option value="IFR">IFR</option>
                <option value="VFR">VFR</option>
              </select>
            </div>
          </div>

          <!-- Remarks -->
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-brandDark mb-1">Remarks & Operational Notes</label>
            <textarea id="notes" rows="2" placeholder="Approach, waypoints, winds, delays..." class="w-full bg-white border border-efbBorder rounded-xl p-2.5 text-sm text-efbTextPrimary focus:outline-none focus:ring-2 focus:ring-brandBright resize-none"></textarea>
          </div>

          <!-- Submit -->
          <button type="submit" class="w-full bg-brandBright hover:bg-brandBlue text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-brandBright/25 transition flex items-center justify-center gap-2 tracking-wider uppercase text-xs">
            <i class="fa-solid fa-circle-check"></i> Save Sector Log
          </button>
        </form>
      </div>

      <p class="text-center text-[10px] text-efbTextSecondary mt-3 font-mono font-semibold">ICAO ELECTRONIC FLIGHT BAG • VIBRANT LIGHT SYSTEM</p>
    </div>

  </div>

  <script>
    const engineDatabase = {
      'A20N': ['CFM LEAP-1A', 'Pratt & Whitney PW1100G'],
      'A21N': ['CFM LEAP-1A', 'Pratt & Whitney PW1100G'],
      'A320': ['CFM56-5A/5B', 'IAE V2500'],
      'A321': ['CFM56-5B', 'IAE V2500'],
      'A332': ['RR Trent 700', 'GE CF6-80E1', 'PW4000'],
      'A333': ['RR Trent 700', 'GE CF6-80E1', 'PW4000'],
      'A339': ['Rolls-Royce Trent 7000'],
      'A359': ['Rolls-Royce Trent XWB-84'],
      'A351': ['Rolls-Royce Trent XWB-97'],
      'A388': ['Engine Alliance GP7200', 'RR Trent 900'],
      'B738': ['CFM56-7B'],
      'B38M': ['CFM LEAP-1B'],
      'B39M': ['CFM LEAP-1B'],
      'B77W': ['General Electric GE90-115B'],
      'B788': ['GEnx-1B', 'Rolls-Royce Trent 1000'],
      'B789': ['GEnx-1B', 'Rolls-Royce Trent 1000'],
      'B78X': ['GEnx-1B', 'Rolls-Royce Trent 1000'],
      'B744': ['GE CF6-80C2', 'PW4056', 'RR RB211-524'],
      'B748': ['General Electric GEnx-2B67']
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      loadFlights();
    });

    function updateEngineVariants() {
      const selectedIcao = document.getElementById('aircraft').value;
      const engineSelect = document.getElementById('engineVariant');
      engineSelect.innerHTML = '';

      const variants = engineDatabase[selectedIcao] || ['Standard / Default Engine'];
      variants.forEach(eng => {
        const opt = document.createElement('option');
        opt.value = eng;
        opt.innerText = eng;
        engineSelect.appendChild(opt);
      });
    }

    function getStoredFlights() {
      return JSON.parse(localStorage.getItem('msfs_flights') || '[]');
    }

    function addStepClimbInput() {
      const container = document.getElementById('flContainer');
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = `Step FL${container.children.length + 1}`;
      input.className = 'fl-input bg-efbCard border border-efbBorder rounded-xl px-3 py-1.5 text-xs font-mono font-bold uppercase text-efbTextPrimary w-44 focus:outline-none focus:border-brandBright';
      container.appendChild(input);
    }

    function calculateDuration() {
      const off = document.getElementById('offBlock').value;
      const on = document.getElementById('onBlock').value;
      if (!off || !on) return;

      const [offH, offM] = off.split(':').map(Number);
      const [onH, onM] = on.split(':').map(Number);

      let totalMinutes = (onH * 60 + onM) - (offH * 60 + offM);
      if (totalMinutes < 0) totalMinutes += 24 * 60;

      const h = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
      const m = (totalMinutes % 60).toString().padStart(2, '0');
      document.getElementById('duration').value = `${h}:${m}`;
    }

    function saveFlight(e) {
      e.preventDefault();
      const flights = getStoredFlights();

      const flInputs = document.querySelectorAll('.fl-input');
      const flightLevels = Array.from(flInputs)
        .map(i => i.value.trim().toUpperCase())
        .filter(v => v !== '');

      const newFlight = {
        id: Date.now(),
        date: document.getElementById('date').value,
        aircraft: document.getElementById('aircraft').value,
        engineVariant: document.getElementById('engineVariant').value,
        flightNumber: document.getElementById('flightNumber').value.toUpperCase(),
        callsign: document.getElementById('callsign').value.toUpperCase(),
        registration: document.getElementById('registration').value.toUpperCase(),
        dep: document.getElementById('dep').value.toUpperCase(),
        arr: document.getElementById('arr').value.toUpperCase(),
        altn: document.getElementById('altn').value.toUpperCase(),
        flightLevels: flightLevels,
        offBlock: document.getElementById('offBlock').value,
        onBlock: document.getElementById('onBlock').value,
        duration: document.getElementById('duration').value,
        rules: document.getElementById('rules').value,
        notes: document.getElementById('notes').value
      };

      flights.unshift(newFlight);
      localStorage.setItem('msfs_flights', JSON.stringify(flights));
      
      document.getElementById('flightForm').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('duration').value = '';
      
      document.getElementById('flContainer').innerHTML = `
        <input type="text" placeholder="Initial FL (e.g. FL340)" class="fl-input bg-efbCard border border-efbBorder rounded-xl px-3 py-1.5 text-xs font-mono font-bold uppercase text-efbTextPrimary w-44 focus:outline-none focus:border-brandBright" required>
      `;
      
      loadFlights();
    }

    function deleteFlight(id) {
      if (!confirm('Delete this sector log?')) return;
      let flights = getStoredFlights();
      flights = flights.filter(f => f.id !== id);
      localStorage.setItem('msfs_flights', JSON.stringify(flights));
      loadFlights();
    }

    function loadFlights() {
      const flights = getStoredFlights();
      const listEl = document.getElementById('flightList');
      listEl.innerHTML = '';

      let totalMins = 0;

      if (flights.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-brandBlue text-xs font-mono font-bold">NO SECTORS LOGGED YET</div>`;
      }

      flights.forEach(f => {
        if (f.duration) {
          const [h, m] = f.duration.split(':').map(Number);
          totalMins += (h * 60) + m;
        }

        const flDisplay = f.flightLevels && f.flightLevels.length > 0 ? f.flightLevels.join(' → ') : 'N/A';

        const card = document.createElement('div');
        card.className = "bg-white border border-efbBorder rounded-2xl p-3.5 shadow-sm transition hover:border-brandBright relative";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <div class="flex items-center gap-2">
              <span class="text-sm font-black text-brandDark font-mono">${f.dep}</span>
              <i class="fa-solid fa-arrow-right text-[10px] text-brandBright"></i>
              <span class="text-sm font-black text-brandDark font-mono">${f.arr}</span>
              ${f.altn ? `<span class="text-[9px] bg-sky-100 text-brandBlue px-1.5 py-0.5 rounded-full font-mono font-bold">ALTN: ${f.altn}</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black text-brandBright font-mono bg-sky-50 px-2 py-0.5 rounded-lg border border-efbBorder">${f.duration || '00:00'}</span>
              <button onclick="deleteFlight(${f.id})" class="text-slate-300 hover:text-red-500 text-xs px-1 transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="flex justify-between items-center text-xs text-efbTextSecondary mb-1 font-medium">
            <span><strong class="text-brandDark font-mono">${f.aircraft}</strong> (${f.engineVariant || 'Std Engine'})</span>
            <span class="font-mono text-[11px]">${f.date}</span>
          </div>
          <div class="flex items-center justify-between text-[11px] font-mono text-efbTextSecondary pt-1.5 border-t border-sky-100">
            <span>FL: <strong class="text-brandDark">${flDisplay}</strong></span>
            <span>${f.flightNumber ? `F/N: <strong class="text-brandDark">${f.flightNumber}</strong>` : ''} ${f.callsign ? `(${f.callsign})` : ''}</span>
          </div>
          ${f.notes ? `<p class="text-[11px] text-slate-500 mt-1.5 italic line-clamp-1 font-mono">${f.notes}</p>` : ''}
        `;
        listEl.appendChild(card);
      });

      const totalH = Math.floor(totalMins / 60).toString().padStart(2, '0');
      const totalM = (totalMins % 60).toString().padStart(2, '0');
      document.getElementById('statTotalHours').innerText = `${totalH}:${totalM}`;
      document.getElementById('statTotalFlights').innerText = flights.length;
    }

    function exportData() {
      const flights = getStoredFlights();
      const blob = new Blob([JSON.stringify(flights, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `efb_logbook_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
  </script>
</body>
</html>
